<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CulturaGest - Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-dark text-white" id="sidebar-wrapper" style="min-height: 100vh; width: 260px; flex-shrink: 0;">
            <div class="sidebar-heading text-center py-4 primary-text fs-4 fw-bold text-uppercase border-bottom border-secondary">
                <i class="fas fa-landmark me-2"></i>CulturaGest
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
                <a href="participantes.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-users me-2"></i>Participantes
                </a>
                <a href="talleres.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-chalkboard-teacher me-2"></i>Talleres
                </a>
                <a href="profesores.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-user-tie me-2"></i>Profesores
                </a>
                <a href="inscripciones.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-pen-square me-2"></i>Inscripciones
                </a>
                <a href="asistencia.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-clipboard-check me-2"></i>Asistencia
                </a>
                <a href="consultas.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-question-circle me-2"></i>Consultas
                </a>
                <a href="reportes.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-chart-bar me-2"></i>Reportes
                </a>
                <a href="administracion.html" class="list-group-item list-group-item-action bg-transparent text-white active">
                    <i class="fas fa-cog me-2"></i>Administración
                </a>
            </div>
            <div class="list-group list-group-flush my-3 border-top border-secondary">
                <a href="login.html" class="list-group-item list-group-item-action bg-transparent text-danger" id="logoutBtn">
                    <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                </a>
            </div>
        </div>

        <!-- Contenido principal -->
        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom px-4">
                <div class="container-fluid">
                    <button class="btn btn-primary" id="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="navbar-brand ms-3 fw-semibold">Administración del Sistema</span>
                    <div class="d-flex align-items-center ms-auto">
                        <span class="me-3"><i class="fas fa-user-circle fa-lg"></i> <span id="userNameDisplay">Usuario</span></span>
                        <span class="badge bg-primary" id="userRolDisplay">Administrador</span>
                    </div>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                <div class="row">
                    <!-- Gestión de Usuarios -->
                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0"><i class="fas fa-users-cog me-2"></i>Gestión de Usuarios</h5>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover">
                                        <thead class="table-dark">
                                            <tr>
                                                <th>ID</th>
                                                <th>Usuario</th>
                                                <th>Rol</th>
                                                <th>Estado</th>
                                                <th>Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody id="usuariosTable">
                                            <!-- Cargado desde la API -->
                                        </tbody>
                                    </table>
                                </div>
                                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#nuevoUsuarioModal">
                                    <i class="fas fa-user-plus"></i> Nuevo Usuario
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Configuración -->
                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0"><i class="fas fa-sliders-h me-2"></i>Configuración</h5>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Nombre del Centro Cultural</label>
                                    <input type="text" class="form-control" id="nombreCentro" value="Centro Cultural Nueva Generación">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email de Contacto</label>
                                    <input type="email" class="form-control" id="emailContacto" value="contacto@culturagest.pe">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Teléfono</label>
                                    <input type="text" class="form-control" id="telefonoCentro" value="(01) 555-1234">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Horario de Atención</label>
                                    <input type="text" class="form-control" id="horarioCentro" value="Lunes a Viernes 9:00 - 18:00">
                                </div>
                                <button class="btn btn-success" id="btnGuardarConfiguracion">
                                    <i class="fas fa-save"></i> Guardar Configuración
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Mantenimiento -->
                <div class="row mt-4">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0"><i class="fas fa-database me-2"></i>Mantenimiento</h5>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-4">
                                        <button class="btn btn-warning w-100 mb-2" id="btnRespaldo">
                                            <i class="fas fa-backup"></i> Respaldo de Datos
                                        </button>
                                    </div>
                                    <div class="col-md-4">
                                        <button class="btn btn-info w-100 mb-2" id="btnLimpiarCache">
                                            <i class="fas fa-sync"></i> Limpiar Caché
                                        </button>
                                    </div>
                                    <div class="col-md-4">
                                        <button class="btn btn-danger w-100 mb-2" id="btnRestaurar">
                                            <i class="fas fa-exclamation-triangle"></i> Restaurar Sistema
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nuevo Usuario -->
    <div class="modal fade" id="nuevoUsuarioModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-plus me-2"></i>Nuevo Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="usuarioForm">
                        <div class="mb-3">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="nombreUsuario" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" id="emailUsuario" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña *</label>
                            <input type="password" class="form-control" id="passwordUsuario" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rol *</label>
                            <select class="form-select" id="rolUsuario" required>
                                <option value="">Seleccionar...</option>
                                <option value="administrador">Administrador</option>
                                <option value="coordinador">Coordinador</option>
                                <option value="recepcion">Recepción</option>
                                <option value="profesor">Profesor</option>
                                <option value="administracion">Administración</option>
                                <option value="comunicacion">Comunicación</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardarUsuario">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        console.log('🚀 Script de administración cargado correctamente');

        // =========================================
        // TOGGLE SIDEBAR
        // =========================================
        document.getElementById("menu-toggle").addEventListener("click", function() {
            const sidebar = document.getElementById("sidebar-wrapper");
            if (sidebar.style.display === "none") {
                sidebar.style.display = "block";
            } else {
                sidebar.style.display = "none";
            }
        });

        // =========================================
        // MOSTRAR NOMBRE Y ROL
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            const userName = sessionStorage.getItem('userName') || 'Usuario';
            const userRol = sessionStorage.getItem('userRol') || 'Administrador';
            document.getElementById('userNameDisplay').textContent = userName;
            document.getElementById('userRolDisplay').textContent = userRol;
        });

        // =========================================
        // CERRAR SESIÓN
        // =========================================
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('¿Está seguro que desea cerrar sesión?')) {
                sessionStorage.removeItem('loggedIn');
                sessionStorage.removeItem('userEmail');
                sessionStorage.removeItem('userName');
                sessionStorage.removeItem('userRol');
                sessionStorage.removeItem('token');
                window.location.href = 'login.html';
            }
        });

        // =========================================
        // REDIRIGIR A LOGIN
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('loggedIn') !== 'true') {
                window.location.href = 'login.html';
            }
        });

        // =========================================
        // CARGAR USUARIOS
        // =========================================
        async function cargarUsuarios() {
            console.log('🔄 cargarUsuarios() ejecutado...');
            try {
                const token = sessionStorage.getItem('token');
                if (!token) {
                    console.warn('⚠️ No hay token de autenticación');
                    return;
                }

                const response = await fetch('http://localhost:3000/api/usuarios', {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                console.log('📊 Datos recibidos:', data);

                if (data.success) {
                    const tbody = document.getElementById('usuariosTable');
                    tbody.innerHTML = '';

                    if (data.data.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="5" class="text-center text-muted py-3">
                                    No hay usuarios registrados
                                </td>
                            </tr>
                        `;
                        return;
                    }

                    data.data.forEach(u => {
                        const tr = document.createElement('tr');
                        const estadoBadge = u.activo ? 'bg-success' : 'bg-danger';
                        const rolBadge = u.rol === 'administrador' ? 'bg-danger' : 
                                        u.rol === 'coordinador' ? 'bg-primary' : 
                                        u.rol === 'profesor' ? 'bg-info' : 'bg-secondary';
                        tr.innerHTML = `
                            <td>${u.id}</td>
                            <td>${u.nombre}</td>
                            <td><span class="badge ${rolBadge}">${u.rol}</span></td>
                            <td><span class="badge ${estadoBadge}">${u.activo ? 'Activo' : 'Inactivo'}</span></td>
                            <td>
                                <button class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                    console.log('✅ Tabla actualizada con', data.data.length, 'usuarios');
                }
            } catch (error) {
                console.error('❌ Error al cargar usuarios:', error);
            }
        }

        // =========================================
        // GUARDAR USUARIO
        // =========================================
        document.getElementById("btnGuardarUsuario").addEventListener("click", async function() {
            const nombre = document.getElementById("nombreUsuario").value.trim();
            const email = document.getElementById("emailUsuario").value.trim();
            const password = document.getElementById("passwordUsuario").value.trim();
            const rol = document.getElementById("rolUsuario").value;

            if (!nombre || !email || !password || !rol) {
                alert('⚠️ Complete todos los campos obligatorios.');
                return;
            }

            try {
                const token = sessionStorage.getItem('token');
                if (!token) {
                    alert('❌ No hay sesión activa.');
                    window.location.href = 'login.html';
                    return;
                }

                const response = await fetch('http://localhost:3000/api/usuarios', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        nombre: nombre,
                        email: email,
                        password: password,
                        rol: rol
                    })
                });

                const data = await response.json();

                if (data.success) {
                    alert('✅ Usuario "' + nombre + '" registrado correctamente.');
                    const modal = bootstrap.Modal.getInstance(document.getElementById('nuevoUsuarioModal'));
                    modal.hide();
                    document.getElementById("usuarioForm").reset();
                    await cargarUsuarios();
                } else {
                    alert('❌ Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error de conexión con el servidor.');
            }
        });

        // =========================================
        // CONFIGURACIÓN
        // =========================================
        document.getElementById("btnGuardarConfiguracion").addEventListener("click", function() {
            const nombre = document.getElementById("nombreCentro").value;
            const email = document.getElementById("emailContacto").value;
            const telefono = document.getElementById("telefonoCentro").value;
            const horario = document.getElementById("horarioCentro").value;

            // Guardar en localStorage
            localStorage.setItem('culturagest_config', JSON.stringify({
                nombre: nombre,
                email: email,
                telefono: telefono,
                horario: horario
            }));

            alert('✅ Configuración guardada correctamente.');
        });

        // =========================================
        // BOTONES DE MANTENIMIENTO
        // =========================================
        document.getElementById("btnRespaldo").addEventListener("click", function() {
            alert('✅ Respaldo de datos realizado correctamente.');
        });

        document.getElementById("btnLimpiarCache").addEventListener("click", function() {
            if (confirm('¿Está seguro que desea limpiar la caché del sistema?')) {
                alert('✅ Caché limpiada correctamente.');
            }
        });

        document.getElementById("btnRestaurar").addEventListener("click", function() {
            if (confirm('⚠️ ¿Está seguro que desea restaurar el sistema? Esta acción no se puede deshacer.')) {
                alert('✅ Sistema restaurado correctamente.');
            }
        });

        // =========================================
        // FORZAR CARGA AL INICIAR
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            // Cargar configuración guardada
            const config = localStorage.getItem('culturagest_config');
            if (config) {
                try {
                    const data = JSON.parse(config);
                    document.getElementById('nombreCentro').value = data.nombre || 'Centro Cultural Nueva Generación';
                    document.getElementById('emailContacto').value = data.email || 'contacto@culturagest.pe';
                    document.getElementById('telefonoCentro').value = data.telefono || '(01) 555-1234';
                    document.getElementById('horarioCentro').value = data.horario || 'Lunes a Viernes 9:00 - 18:00';
                } catch (e) {}
            }

            setTimeout(cargarUsuarios, 500);
        });
    </script>
</body>
</html>
