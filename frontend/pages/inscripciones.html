<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CulturaGest - Inscripciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-dark text-white" id="sidebar-wrapper" style="min-height: 100vh; width: 260px; flex-shrink: 0;">
            <div class="sidebar-heading text-center py-4 primary-text fs-4 fw-bold text-uppercase border-bottom border-secondary">
                <i class="fas fa-landmark me-2"></i>CulturaGest
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
                <a href="participantes.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-users me-2"></i>Participantes
                </a>
                <a href="talleres.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-chalkboard-teacher me-2"></i>Talleres
                </a>
                <a href="profesores.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-user-tie me-2"></i>Profesores
                </a>
                <a href="inscripciones.html" class="list-group-item list-group-item-action bg-transparent text-white active">
                    <i class="fas fa-pen-square me-2"></i>Inscripciones
                </a>
                <a href="asistencia.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-clipboard-check me-2"></i>Asistencia
                </a>
                <a href="consultas.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-question-circle me-2"></i>Consultas
                </a>
                <a href="reportes.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-chart-bar me-2"></i>Reportes
                </a>
                <a href="administracion.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-cog me-2"></i>Administración
                </a>
            </div>
            <div class="list-group list-group-flush my-3 border-top border-secondary">
                <a href="login.html" class="list-group-item list-group-item-action bg-transparent text-danger" id="logoutBtn">
                    <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                </a>
            </div>
        </div>

        <!-- Contenido principal -->
        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom px-4">
                <div class="container-fluid">
                    <button class="btn btn-primary" id="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="navbar-brand ms-3 fw-semibold">Gestión de Inscripciones</span>
                    <div class="d-flex align-items-center ms-auto">
                        <span class="me-3"><i class="fas fa-user-circle fa-lg"></i> <span id="userNameDisplay">Usuario</span></span>
                        <span class="badge bg-primary" id="userRolDisplay">Administrador</span>
                    </div>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                <!-- Formulario de inscripción -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Nueva Inscripción</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-5">
                                <label class="form-label">Participante (Alumno)</label>
                                <select class="form-select" id="participante_id">
                                    <option value="">Seleccionar...</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">Taller</label>
                                <select class="form-select" id="taller_id">
                                    <option value="">Seleccionar...</option>
                                </select>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button class="btn btn-primary w-100" id="btnInscribir">
                                    <i class="fas fa-pen-square"></i> Inscribir
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabla de inscripciones -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-list me-2"></i>Inscripciones Realizadas</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Participante</th>
                                        <th>Taller</th>
                                        <th>Fecha</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="inscripcionesTable">
                                    <!-- Los datos se cargan desde la API -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        console.log('🚀 Script de inscripciones cargado correctamente');

        // =========================================
        // TOGGLE SIDEBAR
        // =========================================
        document.getElementById("menu-toggle").addEventListener("click", function() {
            const sidebar = document.getElementById("sidebar-wrapper");
            if (sidebar.style.display === "none") {
                sidebar.style.display = "block";
            } else {
                sidebar.style.display = "none";
            }
        });

        // =========================================
        // MOSTRAR NOMBRE Y ROL
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            const userName = sessionStorage.getItem('userName') || 'Usuario';
            const userRol = sessionStorage.getItem('userRol') || 'Administrador';
            document.getElementById('userNameDisplay').textContent = userName;
            document.getElementById('userRolDisplay').textContent = userRol;
        });

        // =========================================
        // CERRAR SESIÓN
        // =========================================
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('¿Está seguro que desea cerrar sesión?')) {
                sessionStorage.removeItem('loggedIn');
                sessionStorage.removeItem('userEmail');
                sessionStorage.removeItem('userName');
                sessionStorage.removeItem('userRol');
                sessionStorage.removeItem('token');
                window.location.href = 'login.html';
            }
        });

        // =========================================
        // REDIRIGIR A LOGIN
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('loggedIn') !== 'true') {
                window.location.href = 'login.html';
            }
        });

        // =========================================
        // CARGAR PARTICIPANTES PARA EL SELECT
        // =========================================
        async function cargarParticipantesSelect() {
            try {
                const token = sessionStorage.getItem('token');
                if (!token) return;

                const response = await fetch('http://localhost:3000/api/participantes', {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                if (data.success) {
                    const select = document.getElementById('participante_id');
                    select.innerHTML = '<option value="">Seleccionar...</option>';
                    data.data.forEach(p => {
                        const option = document.createElement('option');
                        option.value = p.id;
                        option.textContent = p.nombre + ' ' + p.apellido;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error al cargar participantes:', error);
            }
        }

        // =========================================
        // CARGAR TALLERES PARA EL SELECT
        // =========================================
        async function cargarTalleresSelect() {
            try {
                const token = sessionStorage.getItem('token');
                if (!token) return;

                const response = await fetch('http://localhost:3000/api/talleres', {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                if (data.success) {
                    const select = document.getElementById('taller_id');
                    select.innerHTML = '<option value="">Seleccionar...</option>';
                    data.data.forEach(t => {
                        const option = document.createElement('option');
                        option.value = t.id;
                        option.textContent = t.nombre + ' (' + t.cupos_disponibles + ' cupos)';
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error al cargar talleres:', error);
            }
        }

        // =========================================
        // CARGAR INSCRIPCIONES
        // =========================================
        async function cargarInscripciones() {
            console.log('🔄 cargarInscripciones() ejecutado...');
            try {
                const token = sessionStorage.getItem('token');
                if (!token) {
                    console.warn('⚠️ No hay token de autenticación');
                    return;
                }

                const response = await fetch('http://localhost:3000/api/inscripciones', {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                console.log('📊 Datos recibidos:', data);

                if (data.success) {
                    const tbody = document.getElementById('inscripcionesTable');
                    tbody.innerHTML = '';

                    if (data.data.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="6" class="text-center text-muted py-3">
                                    No hay inscripciones registradas
                                </td>
                            </tr>
                        `;
                        return;
                    }

                    data.data.forEach(i => {
                        const tr = document.createElement('tr');
                        const estadoBadge = i.estado === 'activo' ? 'bg-success' : 'bg-warning';
                        tr.innerHTML = `
                            <td>${i.id}</td>
                            <td>${i.participante || 'ID ' + i.participante_id}</td>
                            <td>${i.taller || 'ID ' + i.taller_id}</td>
                            <td>${new Date(i.fecha_inscripcion).toLocaleDateString()}</td>
                            <td><span class="badge ${estadoBadge}">${i.estado}</span></td>
                            <td>
                                <button class="btn btn-sm btn-danger cancelar-inscripcion" data-id="${i.id}">
                                    <i class="fas fa-times"></i> Cancelar
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });

                    // Eventos para cancelar inscripción
                    document.querySelectorAll('.cancelar-inscripcion').forEach(btn => {
                        btn.addEventListener('click', cancelarInscripcion);
                    });
                }
            } catch (error) {
                console.error('❌ Error al cargar inscripciones:', error);
            }
        }

        // =========================================
        // INSCRIBIR PARTICIPANTE
        // =========================================
        document.getElementById("btnInscribir").addEventListener("click", async function() {
            const participante_id = document.getElementById("participante_id").value;
            const taller_id = document.getElementById("taller_id").value;

            if (!participante_id || !taller_id) {
                alert('⚠️ Seleccione un participante y un taller.');
                return;
            }

            try {
                const token = sessionStorage.getItem('token');
                if (!token) {
                    alert('❌ No hay sesión activa.');
                    window.location.href = 'login.html';
                    return;
                }

                const response = await fetch('http://localhost:3000/api/inscripciones', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        participante_id: parseInt(participante_id),
                        taller_id: parseInt(taller_id)
                    })
                });

                const data = await response.json();

                if (data.success) {
                    alert('✅ Inscripción realizada correctamente.');
                    // Recargar selects y tabla
                    await Promise.all([
                        cargarParticipantesSelect(),
                        cargarTalleresSelect(),
                        cargarInscripciones()
                    ]);
                } else {
                    alert('❌ Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error de conexión con el servidor.');
            }
        });

        // =========================================
        // CANCELAR INSCRIPCIÓN
        // =========================================
        async function cancelarInscripcion(e) {
            const id = e.currentTarget.dataset.id;
            if (!confirm('¿Está seguro que desea cancelar esta inscripción?')) return;

            try {
                const token = sessionStorage.getItem('token');
                if (!token) {
                    alert('❌ No hay sesión activa.');
                    window.location.href = 'login.html';
                    return;
                }

                const response = await fetch(`http://localhost:3000/api/inscripciones/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.success) {
                    alert('✅ Inscripción cancelada correctamente.');
                    await Promise.all([
                        cargarTalleresSelect(),
                        cargarInscripciones()
                    ]);
                } else {
                    alert('❌ Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error de conexión con el servidor.');
            }
        }

        // =========================================
        // FORZAR CARGA AL INICIAR
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                cargarParticipantesSelect();
                cargarTalleresSelect();
                cargarInscripciones();
            }, 500);
        });
    </script>
</body>
</html>
