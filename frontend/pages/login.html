<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CulturaGest - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="login-page">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="display-1 text-primary">
                                <i class="fas fa-landmark"></i>
                            </div>
                            <h2 class="fw-bold text-primary">CulturaGest</h2>
                            <p class="text-muted">Sistema de Gestión Cultural</p>
                        </div>

                        <div id="errorMessage" class="alert alert-danger d-none">
                            <i class="fas fa-exclamation-circle"></i> 
                            <span id="errorText">Credenciales incorrectas</span>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">
                                    <i class="fas fa-envelope text-primary me-1"></i> Correo Electrónico
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">
                                    <i class="fas fa-lock text-primary me-1"></i> Contraseña
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" required>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label" for="remember">Recordarme</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="loginBtn">
                                <i class="fas fa-spinner fa-spin d-none" id="loadingSpinner"></i>
                                <span id="loginText"><i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión</span>
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <small class="text-muted">© 2026 CulturaGest - Todos los derechos reservados</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/scripts.js"></script>
    <script>
        // =========================================
        // TOGGLE CONTRASEÑA
        // =========================================
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // =========================================
        // LOGIN CON API (BACKEND)
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const loginBtn = document.getElementById('loginBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const loginText = document.getElementById('loginText');

            // Si ya está logueado, ir al dashboard
            if (sessionStorage.getItem('token')) {
                window.location.href = 'dashboard.html';
            }

            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();

                // Mostrar loading
                loadingSpinner.classList.remove('d-none');
                loginText.textContent = 'Verificando...';
                loginBtn.disabled = true;

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    // Ocultar loading
                    loadingSpinner.classList.add('d-none');
                    loginText.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión';
                    loginBtn.disabled = false;

                    if (data.success) {
                        // Guardar token y datos del usuario
                        sessionStorage.setItem('token', data.token);
                        sessionStorage.setItem('userName', data.data.nombre);
                        sessionStorage.setItem('userEmail', data.data.email);
                        sessionStorage.setItem('userRol', data.data.rol);
                        sessionStorage.setItem('loggedIn', 'true');

                        errorMessage.classList.add('d-none');

                        // Mostrar mensaje de éxito
                        mostrarMensaje('✅ ¡Bienvenido ' + data.data.nombre + '!', 'success');

                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1500);
                    } else {
                        errorText.textContent = data.error || 'Credenciales incorrectas';
                        errorMessage.classList.remove('d-none');
                    }
                } catch (error) {
                    loadingSpinner.classList.add('d-none');
                    loginText.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión';
                    loginBtn.disabled = false;
                    
                    errorText.textContent = 'Error de conexión con el servidor';
                    errorMessage.classList.remove('d-none');
                    console.error('Error:', error);
                }
            });
        });

        // =========================================
        // FUNCIÓN DE MENSAJES
        // =========================================
        function mostrarMensaje(mensaje, tipo = 'success') {
            const alertClass = tipo === 'success' ? 'alert-success' : 'alert-danger';
            const icon = tipo === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            
            const alertHtml = `
                <div class="alert ${alertClass} alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3" 
                     style="z-index: 9999; min-width: 320px; box-shadow: 0 10px 40px rgba(0,0,0,0.12); border-radius: 12px;" role="alert">
                    <i class="fas ${icon} me-2"></i>
                    ${mensaje}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>
            `;
            
            const container = document.createElement('div');
            container.innerHTML = alertHtml;
            document.body.appendChild(container.firstElementChild);
            
            setTimeout(() => {
                const alert = document.querySelector('.alert.position-fixed');
                if (alert) {
                    alert.classList.remove('show');
                    setTimeout(() => alert.remove(), 500);
                }
            }, 5000);
        }
    </script>
</body>
</html>
