<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CulturaGest - Participantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-dark text-white" id="sidebar-wrapper" style="min-height: 100vh; width: 260px; flex-shrink: 0;">
            <div class="sidebar-heading text-center py-4 primary-text fs-4 fw-bold text-uppercase border-bottom border-secondary">
                <i class="fas fa-landmark me-2"></i>CulturaGest
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
                <a href="participantes.html" class="list-group-item list-group-item-action bg-transparent text-white active">
                    <i class="fas fa-users me-2"></i>Participantes
                </a>
                <a href="talleres.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-chalkboard-teacher me-2"></i>Talleres
                </a>
                <a href="profesores.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-user-tie me-2"></i>Profesores
                </a>
                <a href="inscripciones.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-pen-square me-2"></i>Inscripciones
                </a>
                <a href="asistencia.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-clipboard-check me-2"></i>Asistencia
                </a>
                <a href="consultas.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-question-circle me-2"></i>Consultas
                </a>
                <a href="reportes.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-chart-bar me-2"></i>Reportes
                </a>
                <a href="administracion.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-cog me-2"></i>Administración
                </a>
            </div>
            <div class="list-group list-group-flush my-3 border-top border-secondary">
                <a href="login.html" class="list-group-item list-group-item-action bg-transparent text-danger" id="logoutBtn">
                    <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                </a>
            </div>
        </div>

        <!-- Contenido principal -->
        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom px-4">
                <div class="container-fluid">
                    <button class="btn btn-primary" id="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="navbar-brand ms-3 fw-semibold">Gestión de Participantes</span>
                    <div class="d-flex align-items-center ms-auto">
                        <span class="me-3"><i class="fas fa-user-circle fa-lg"></i> <span id="userNameDisplay">Usuario</span></span>
                        <span class="badge bg-primary" id="userRolDisplay">Administrador</span>
                    </div>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-users me-2"></i>Lista de Participantes (Alumnos)</h5>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#registroParticipanteModal">
                            <i class="fas fa-plus"></i> Nuevo Participante
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                                    <input type="text" class="form-control" id="searchInput" placeholder="Buscar participante...">
                                </div>
                            </div>
                            <div class="col-md-6 text-end">
                                <button class="btn btn-outline-secondary"><i class="fas fa-download"></i> Exportar</button>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Apellido</th>
                                        <th>Email</th>
                                        <th>Teléfono</th>
                                        <th>Tipo</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="participantesTable">
                                    <!-- Los datos se cargan desde la API -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="registroParticipanteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-plus me-2"></i>Registrar Participante (Alumno)</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="participanteForm">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="apellido" class="form-label">Apellido *</label>
                            <input type="text" class="form-control" id="apellido" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo</label>
                            <input type="text" class="form-control" value="Alumno" disabled>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="guardarParticipante">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        console.log('🚀 Script de participantes cargado correctamente');

        // =========================================
        // TOGGLE SIDEBAR
        // =========================================
        document.getElementById("menu-toggle").addEventListener("click", function() {
            const sidebar = document.getElementById("sidebar-wrapper");
            if (sidebar.style.display === "none") {
                sidebar.style.display = "block";
            } else {
                sidebar.style.display = "none";
            }
        });

        // =========================================
        // MOSTRAR NOMBRE Y ROL
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            const userName = sessionStorage.getItem('userName') || 'Usuario';
            const userRol = sessionStorage.getItem('userRol') || 'Administrador';
            document.getElementById('userNameDisplay').textContent = userName;
            document.getElementById('userRolDisplay').textContent = userRol;
        });

        // =========================================
        // CERRAR SESIÓN
        // =========================================
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('¿Está seguro que desea cerrar sesión?')) {
                sessionStorage.removeItem('loggedIn');
                sessionStorage.removeItem('userEmail');
                sessionStorage.removeItem('userName');
                sessionStorage.removeItem('userRol');
                sessionStorage.removeItem('token');
                window.location.href = 'login.html';
            }
        });

        // =========================================
        // REDIRIGIR A LOGIN
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('loggedIn') !== 'true') {
                window.location.href = 'login.html';
            }
        });

        // =========================================
        // CARGAR PARTICIPANTES
        // =========================================
        async function cargarParticipantes() {
            console.log('🔄 cargarParticipantes() ejecutado...');
            try {
                const token = sessionStorage.getItem('token');
                if (!token) {
                    console.warn('⚠️ No hay token de autenticación');
                    return;
                }

                const response = await fetch('http://localhost:3000/api/participantes', {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                console.log('📊 Datos recibidos:', data);

                if (data.success) {
                    const tbody = document.getElementById('participantesTable');
                    tbody.innerHTML = '';

                    if (data.data.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="7" class="text-center text-muted py-3">
                                    No hay participantes registrados
                                </td>
                            </tr>
                        `;
                        return;
                    }

                    data.data.forEach(p => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${p.id}</td>
                            <td>${p.nombre}</td>
                            <td>${p.apellido}</td>
                            <td>${p.email}</td>
                            <td>${p.telefono || '-'}</td>
                            <td><span class="badge bg-info">Alumno</span></td>
                            <td>
                                <button class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                    console.log('✅ Tabla actualizada con', data.data.length, 'participantes');
                }
            } catch (error) {
                console.error('❌ Error al cargar participantes:', error);
            }
        }

        // =========================================
        // GUARDAR PARTICIPANTE
        // =========================================
        document.getElementById("guardarParticipante").addEventListener("click", async function() {
            const nombre = document.getElementById("nombre").value.trim();
            const apellido = document.getElementById("apellido").value.trim();
            const email = document.getElementById("email").value.trim();
            const telefono = document.getElementById("telefono").value.trim();

            if (!nombre || !apellido || !email) {
                alert('⚠️ Complete todos los campos obligatorios.');
                return;
            }

            try {
                const token = sessionStorage.getItem('token');
                if (!token) {
                    alert('❌ No hay sesión activa.');
                    window.location.href = 'login.html';
                    return;
                }

                const response = await fetch('http://localhost:3000/api/participantes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        nombre: nombre,
                        apellido: apellido,
                        email: email,
                        telefono: telefono || ''
                    })
                });

                const data = await response.json();

                if (data.success) {
                    alert('✅ Participante "' + nombre + ' ' + apellido + '" registrado correctamente.');
                    const modal = bootstrap.Modal.getInstance(document.getElementById('registroParticipanteModal'));
                    modal.hide();
                    document.getElementById("participanteForm").reset();
                    await cargarParticipantes();
                } else {
                    alert('❌ Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error de conexión con el servidor.');
            }
        });

        // =========================================
        // BÚSQUEDA
        // =========================================
        document.getElementById("searchInput").addEventListener("keyup", function() {
            const filter = this.value.toLowerCase();
            const rows = document.querySelectorAll("#participantesTable tr");
            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(filter) ? "" : "none";
            });
        });

        // =========================================
        // FORZAR CARGA AL INICIAR
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(cargarParticipantes, 500);
        });
    </script>
</body>
</html>
