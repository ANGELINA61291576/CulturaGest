<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CulturaGest - Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-dark text-white" id="sidebar-wrapper" style="min-height: 100vh; width: 260px; flex-shrink: 0;">
            <div class="sidebar-heading text-center py-4 primary-text fs-4 fw-bold text-uppercase border-bottom border-secondary">
                <i class="fas fa-landmark me-2"></i>CulturaGest
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
                <a href="participantes.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-users me-2"></i>Participantes
                </a>
                <a href="talleres.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-chalkboard-teacher me-2"></i>Talleres
                </a>
                <a href="profesores.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-user-tie me-2"></i>Profesores
                </a>
                <a href="inscripciones.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-pen-square me-2"></i>Inscripciones
                </a>
                <a href="asistencia.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-clipboard-check me-2"></i>Asistencia
                </a>
                <a href="consultas.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-question-circle me-2"></i>Consultas
                </a>
                <a href="reportes.html" class="list-group-item list-group-item-action bg-transparent text-white active">
                    <i class="fas fa-chart-bar me-2"></i>Reportes
                </a>
                <a href="administracion.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-cog me-2"></i>Administración
                </a>
            </div>
            <div class="list-group list-group-flush my-3 border-top border-secondary">
                <a href="login.html" class="list-group-item list-group-item-action bg-transparent text-danger" id="logoutBtn">
                    <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                </a>
            </div>
        </div>

        <!-- Contenido principal -->
        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom px-4">
                <div class="container-fluid">
                    <button class="btn btn-primary" id="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="navbar-brand ms-3 fw-semibold">Reportes</span>
                    <div class="d-flex align-items-center ms-auto">
                        <span class="me-3"><i class="fas fa-user-circle fa-lg"></i> <span id="userNameDisplay">Usuario</span></span>
                        <span class="badge bg-primary" id="userRolDisplay">Administrador</span>
                    </div>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                <!-- Filtros -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-filter me-2"></i>Filtros de Reportes</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <label class="form-label">Tipo de Reporte</label>
                                <select class="form-select" id="tipoReporte">
                                    <option value="participantes">Participantes</option>
                                    <option value="talleres">Talleres</option>
                                    <option value="inscripciones">Inscripciones</option>
                                    <option value="asistencia">Asistencia</option>
                                    <option value="consultas">Consultas</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Fecha Inicio</label>
                                <input type="date" class="form-control" id="fechaInicio">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Fecha Fin</label>
                                <input type="date" class="form-control" id="fechaFin">
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button class="btn btn-primary w-100" id="btnGenerarReporte">
                                    <i class="fas fa-file-pdf"></i> Generar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Resultados -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-chart-bar me-2"></i>Resultados</h5>
                    </div>
                    <div class="card-body">
                        <div id="resultadosReporte">
                            <div class="text-center text-muted py-4">
                                <i class="fas fa-chart-pie fa-3x mb-3"></i>
                                <p>Seleccione un tipo de reporte y haga clic en "Generar"</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        console.log('🚀 Script de reportes cargado correctamente');

        // =========================================
        // TOGGLE SIDEBAR
        // =========================================
        document.getElementById("menu-toggle").addEventListener("click", function() {
            const sidebar = document.getElementById("sidebar-wrapper");
            if (sidebar.style.display === "none") {
                sidebar.style.display = "block";
            } else {
                sidebar.style.display = "none";
            }
        });

        // =========================================
        // MOSTRAR NOMBRE Y ROL
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            const userName = sessionStorage.getItem('userName') || 'Usuario';
            const userRol = sessionStorage.getItem('userRol') || 'Administrador';
            document.getElementById('userNameDisplay').textContent = userName;
            document.getElementById('userRolDisplay').textContent = userRol;
            // Fechas por defecto (último mes)
            const hoy = new Date();
            const haceUnMes = new Date();
            haceUnMes.setMonth(haceUnMes.getMonth() - 1);
            document.getElementById('fechaInicio').value = haceUnMes.toISOString().split('T')[0];
            document.getElementById('fechaFin').value = hoy.toISOString().split('T')[0];
        });

        // =========================================
        // CERRAR SESIÓN
        // =========================================
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('¿Está seguro que desea cerrar sesión?')) {
                sessionStorage.removeItem('loggedIn');
                sessionStorage.removeItem('userEmail');
                sessionStorage.removeItem('userName');
                sessionStorage.removeItem('userRol');
                sessionStorage.removeItem('token');
                window.location.href = 'login.html';
            }
        });

        // =========================================
        // REDIRIGIR A LOGIN
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('loggedIn') !== 'true') {
                window.location.href = 'login.html';
            }
        });

        // =========================================
        // GENERAR REPORTE
        // =========================================
        document.getElementById("btnGenerarReporte").addEventListener("click", async function() {
            const tipo = document.getElementById("tipoReporte").value;
            const fechaInicio = document.getElementById("fechaInicio").value;
            const fechaFin = document.getElementById("fechaFin").value;

            console.log('📊 Generando reporte:', tipo, fechaInicio, fechaFin);

            try {
                const token = sessionStorage.getItem('token');
                if (!token) {
                    alert('❌ No hay sesión activa.');
                    window.location.href = 'login.html';
                    return;
                }

                const headers = {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                };

                let endpoint = '';
                let titulo = '';

                switch(tipo) {
                    case 'participantes':
                        endpoint = 'http://localhost:3000/api/participantes';
                        titulo = 'Reporte de Participantes';
                        break;
                    case 'talleres':
                        endpoint = 'http://localhost:3000/api/talleres';
                        titulo = 'Reporte de Talleres';
                        break;
                    case 'inscripciones':
                        endpoint = 'http://localhost:3000/api/inscripciones';
                        titulo = 'Reporte de Inscripciones';
                        break;
                    case 'asistencia':
                        endpoint = 'http://localhost:3000/api/asistencia';
                        titulo = 'Reporte de Asistencia';
                        break;
                    case 'consultas':
                        endpoint = 'http://localhost:3000/api/consultas';
                        titulo = 'Reporte de Consultas';
                        break;
                    default:
                        alert('Tipo de reporte no válido');
                        return;
                }

                const response = await fetch(endpoint, { headers });
                const data = await response.json();

                console.log('📊 Datos del reporte:', data);

                if (data.success) {
                    mostrarResultados(titulo, data.data, tipo);
                } else {
                    alert('❌ Error al generar el reporte: ' + (data.error || 'Error desconocido'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error de conexión con el servidor.');
            }
        });

        // =========================================
        // MOSTRAR RESULTADOS
        // =========================================
        function mostrarResultados(titulo, datos, tipo) {
            const container = document.getElementById('resultadosReporte');

            if (!datos || datos.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-muted py-4">
                        <i class="fas fa-exclamation-circle fa-3x mb-3"></i>
                        <p>No se encontraron datos para el reporte seleccionado.</p>
                    </div>
                `;
                return;
            }

            // Generar tabla según el tipo
            let headers = [];
            let rows = '';

            switch(tipo) {
                case 'participantes':
                    headers = ['ID', 'Nombre', 'Apellido', 'Email', 'Teléfono'];
                    datos.forEach(d => {
                        rows += `
                            <tr>
                                <td>${d.id}</td>
                                <td>${d.nombre}</td>
                                <td>${d.apellido}</td>
                                <td>${d.email}</td>
                                <td>${d.telefono || '-'}</td>
                            </tr>
                        `;
                    });
                    break;
                case 'talleres':
                    headers = ['ID', 'Nombre', 'Categoría', 'Cupos', 'Disponibles'];
                    datos.forEach(d => {
                        rows += `
                            <tr>
                                <td>${d.id}</td>
                                <td>${d.nombre}</td>
                                <td>${d.categoria}</td>
                                <td>${d.cupos_maximos}</td>
                                <td>${d.cupos_disponibles}</td>
                            </tr>
                        `;
                    });
                    break;
                case 'inscripciones':
                    headers = ['ID', 'Participante', 'Taller', 'Fecha', 'Estado'];
                    datos.forEach(d => {
                        rows += `
                            <tr>
                                <td>${d.id}</td>
                                <td>${d.participante || 'ID ' + d.participante_id}</td>
                                <td>${d.taller || 'ID ' + d.taller_id}</td>
                                <td>${new Date(d.fecha_inscripcion).toLocaleDateString()}</td>
                                <td><span class="badge ${d.estado === 'activo' ? 'bg-success' : 'bg-warning'}">${d.estado}</span></td>
                            </tr>
                        `;
                    });
                    break;
                case 'asistencia':
                    headers = ['ID', 'Participante', 'Taller', 'Fecha', 'Estado'];
                    datos.forEach(d => {
                        rows += `
                            <tr>
                                <td>${d.id}</td>
                                <td>${d.participante || 'ID ' + d.inscripcion_id}</td>
                                <td>${d.taller || '-'}</td>
                                <td>${d.fecha}</td>
                                <td><span class="badge ${d.presente ? 'bg-success' : 'bg-danger'}">${d.presente ? 'Presente' : 'Ausente'}</span></td>
                            </tr>
                        `;
                    });
                    break;
                case 'consultas':
                    headers = ['ID', 'Participante', 'Tipo', 'Descripción', 'Estado'];
                    datos.forEach(d => {
                        rows += `
                            <tr>
                                <td>${d.id}</td>
                                <td>${d.participante || 'ID ' + d.participante_id}</td>
                                <td>${d.tipo}</td>
                                <td>${d.descripcion}</td>
                                <td><span class="badge ${d.estado === 'atendido' ? 'bg-success' : 'bg-warning'}">${d.estado}</span></td>
                            </tr>
                        `;
                    });
                    break;
                default:
                    container.innerHTML = `<p>Tipo de reporte no reconocido</p>`;
                    return;
            }

            container.innerHTML = `
                <h6 class="mb-3">${titulo}</h6>
                <p class="text-muted small">Total de registros: ${datos.length}</p>
                <div class="table-responsive">
                    <table class="table table-hover table-bordered">
                        <thead class="table-dark">
                            <tr>
                                ${headers.map(h => `<th>${h}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </div>
                <div class="mt-3">
                    <button class="btn btn-outline-secondary btn-sm" onclick="window.print()">
                        <i class="fas fa-print"></i> Imprimir
                    </button>
                </div>
            `;
        }
    </script>
</body>
</html>
