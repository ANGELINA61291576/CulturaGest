<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CulturaGest - Talleres</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-dark text-white" id="sidebar-wrapper" style="min-height: 100vh; width: 260px; flex-shrink: 0;">
            <div class="sidebar-heading text-center py-4 primary-text fs-4 fw-bold text-uppercase border-bottom border-secondary">
                <i class="fas fa-landmark me-2"></i>CulturaGest
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
                <a href="participantes.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-users me-2"></i>Participantes
                </a>
                <a href="talleres.html" class="list-group-item list-group-item-action bg-transparent text-white active">
                    <i class="fas fa-chalkboard-teacher me-2"></i>Talleres
                </a>
                <a href="profesores.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-user-tie me-2"></i>Profesores
                </a>
                <a href="inscripciones.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-pen-square me-2"></i>Inscripciones
                </a>
                <a href="asistencia.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-clipboard-check me-2"></i>Asistencia
                </a>
                <a href="consultas.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-question-circle me-2"></i>Consultas
                </a>
                <a href="reportes.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-chart-bar me-2"></i>Reportes
                </a>
                <a href="administracion.html" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="fas fa-cog me-2"></i>Administración
                </a>
            </div>
            <div class="list-group list-group-flush my-3 border-top border-secondary">
                <a href="login.html" class="list-group-item list-group-item-action bg-transparent text-danger" id="logoutBtn">
                    <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                </a>
            </div>
        </div>

        <!-- Contenido principal -->
        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom px-4">
                <div class="container-fluid">
                    <button class="btn btn-primary" id="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="navbar-brand ms-3 fw-semibold">Gestión de Talleres</span>
                    <div class="d-flex align-items-center ms-auto">
                        <span class="me-3"><i class="fas fa-user-circle fa-lg"></i> <span id="userNameDisplay">Usuario</span></span>
                        <span class="badge bg-primary" id="userRolDisplay">Administrador</span>
                    </div>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-chalkboard-teacher me-2"></i>Lista de Talleres</h5>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#registroTallerModal">
                            <i class="fas fa-plus"></i> Nuevo Taller
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Categoría</th>
                                        <th>Profesor</th>
                                        <th>Cupos</th>
                                        <th>Disponibles</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="talleresTable">
                                    <!-- Datos cargados desde la API -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Registrar Taller -->
    <div class="modal fade" id="registroTallerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-plus-circle me-2"></i>Registrar Taller</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="tallerForm">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Taller *</label>
                            <input type="text" class="form-control" id="tallerNombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría *</label>
                            <select class="form-select" id="tallerCategoria" required>
                                <option value="">Seleccionar...</option>
                                <option>Música</option>
                                <option>Danza</option>
                                <option>Teatro</option>
                                <option>Pintura</option>
                                <option>Lectura</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Profesor *</label>
                            <select class="form-select" id="tallerProfesor" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cupos Máximos *</label>
                            <input type="number" class="form-control" id="tallerCupos" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="guardarTaller">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/scripts.js"></script>
    <script>
        // =========================================
        // 1. TOGGLE SIDEBAR
        // =========================================
        document.getElementById("menu-toggle").addEventListener("click", function() {
            const sidebar = document.getElementById("sidebar-wrapper");
            if (sidebar.style.display === "none") {
                sidebar.style.display = "block";
            } else {
                sidebar.style.display = "none";
            }
        });

        // =========================================
        // 2. MOSTRAR NOMBRE Y ROL DE USUARIO
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            const userName = sessionStorage.getItem('userName') || 'Usuario';
            const userRol = sessionStorage.getItem('userRol') || 'Administrador';
            document.getElementById('userNameDisplay').textContent = userName;
            document.getElementById('userRolDisplay').textContent = userRol;
        });

        // =========================================
        // 3. CERRAR SESIÓN
        // =========================================
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('¿Está seguro que desea cerrar sesión?')) {
                sessionStorage.removeItem('loggedIn');
                sessionStorage.removeItem('userEmail');
                sessionStorage.removeItem('userName');
                sessionStorage.removeItem('userRol');
                sessionStorage.removeItem('token');
                window.location.href = 'login.html';
            }
        });

        // =========================================
        // 4. REDIRIGIR A LOGIN SI NO ESTÁ LOGUEADO
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('loggedIn') !== 'true') {
                window.location.href = 'login.html';
            }
        });

        // =========================================
        // 5. CARGAR TALLERES DESDE LA API
        // =========================================
        async function cargarTalleres() {
            try {
                const token = sessionStorage.getItem('token');
                if (!token) return;

                const response = await fetch('http://localhost:3000/api/talleres', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();

                if (data.success) {
                    const tbody = document.getElementById('talleresTable');
                    tbody.innerHTML = '';
                    data.data.forEach(t => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${t.id}</td>
                            <td>${t.nombre}</td>
                            <td><span class="badge bg-primary">${t.categoria}</span></td>
                            <td>Prof. ID ${t.profesor_id}</td>
                            <td>${t.cupos_maximos}</td>
                            <td><span class="badge ${t.cupos_disponibles > 0 ? 'bg-success' : 'bg-danger'}">${t.cupos_disponibles}</span></td>
                            <td>
                                <button class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error('Error al cargar talleres:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', cargarTalleres);
    </script>
</body>
</html>
