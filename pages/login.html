<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CulturaGest - Iniciar Sesión</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="login-page">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <!-- Logo / Título -->
                        <div class="text-center mb-4">
                            <div class="display-1 text-primary">
                                <i class="fas fa-landmark"></i>
                            </div>
                            <h2 class="fw-bold text-primary">CulturaGest</h2>
                            <p class="text-muted">Sistema de Gestión Cultural</p>
                        </div>

                        <!-- Mensaje de error -->
                        <div id="errorMessage" class="alert alert-danger d-none">
                            <i class="fas fa-exclamation-circle"></i> 
                            Credenciales incorrectas. Usa un email válido y contraseña de al menos 4 caracteres.
                        </div>

                        <!-- Formulario de Login -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">
                                    <i class="fas fa-envelope text-primary me-1"></i> Correo Electrónico
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">
                                    <i class="fas fa-lock text-primary me-1"></i> Contraseña
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" required>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label" for="remember">Recordarme</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                <i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión
                            </button>
                        </form>

                        <!-- Pie de página -->
                        <div class="text-center mt-4">
                            <small class="text-muted">© 2026 CulturaGest - Todos los derechos reservados</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/scripts.js"></script>
    <script>
        // =========================================
        // 1. TOGGLE CONTRASEÑA (Mostrar/Ocultar)
        // =========================================
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // =========================================
        // 2. LOGIN - REDIRIGIR AL DASHBOARD
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');

            // Si ya está logueado, ir al dashboard
            if (sessionStorage.getItem('loggedIn') === 'true') {
                window.location.href = 'dashboard.html';
            }

            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();

                // 🔓 SIMULACIÓN DE LOGIN
                // Cualquier email con @ y contraseña de al menos 4 caracteres
                if (email.includes('@') && password.length >= 4) {
                    // Guardar sesión
                    sessionStorage.setItem('loggedIn', 'true');
                    sessionStorage.setItem('userEmail', email);
                    sessionStorage.setItem('userName', email.split('@')[0]);

                    // Ocultar error
                    errorMessage.classList.add('d-none');

                    // Mostrar mensaje de éxito
                    mostrarMensaje('✅ ¡Bienvenido ' + email.split('@')[0] + '! Redirigiendo...', 'success');

                    // Redirigir al dashboard después de 1 segundo
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1200);
                } else {
                    // Mostrar error
                    errorMessage.classList.remove('d-none');
                }
            });
        });

        // =========================================
        // 3. FUNCIÓN DE MENSAJES (si no existe en scripts.js)
        // =========================================
        function mostrarMensaje(mensaje, tipo = 'success') {
            const alertClass = tipo === 'success' ? 'alert-success' : 'alert-danger';
            const icon = tipo === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            
            const alertHtml = `
                <div class="alert ${alertClass} alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3" 
                     style="z-index: 9999; min-width: 320px; box-shadow: 0 10px 40px rgba(0,0,0,0.12); border-radius: 12px;" role="alert">
                    <i class="fas ${icon} me-2"></i>
                    ${mensaje}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>
            `;
            
            const container = document.createElement('div');
            container.innerHTML = alertHtml;
            document.body.appendChild(container.firstElementChild);
            
            // Auto cerrar después de 5 segundos
            setTimeout(() => {
                const alert = document.querySelector('.alert.position-fixed');
                if (alert) {
                    alert.classList.remove('show');
                    setTimeout(() => alert.remove(), 500);
                }
            }, 5000);
        }
    </script>
</body>
</html>
